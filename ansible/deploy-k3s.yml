---
- name: Prepare all nodes
  hosts: all
  become: yes
  tasks:
    - name: Update and upgrade apt packages
      ansible.builtin.shell:
        cmd: apt update && apt upgrade -y
      register: apt_result
      changed_when: "'0 upgraded' not in apt_result.stdout"

    - name: Create /etc/rancher/k3s/
      ansible.builtin.file:
        path: /etc/rancher/k3s/
        state: directory
        mode: "0755"

    # Optional private registry (e.g. GCP Artifact Registry). Written before
    # k3s installs so containerd picks it up on first start; if k3s is already
    # running, the handler restarts it. See all.yml.example.
    - name: Check if k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Configure private registry
      ansible.builtin.template:
        src: files/k3s-config/registries.yaml.j2
        dest: /etc/rancher/k3s/registries.yaml
        mode: "0600"
      when: k3s_registry_host is defined
      notify: Restart k3s

  handlers:
    # Fresh installs pick registries.yaml up on first start, so only restart when
    # k3s is already running.
    - name: Restart k3s
      ansible.builtin.systemd:
        name: "{{ 'k3s' if 'k3s_server' in group_names else 'k3s-agent' }}"
        state: restarted
      when: k3s_binary.stat.exists

- name: Deploy k3s server
  hosts: k3s_server
  become: yes
  tasks:
    - name: Copy k3s server config
      ansible.builtin.template:
        src: files/k3s-config/config-server.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"

    - name: Install k3s server
      ansible.builtin.shell:
        cmd: curl -sfL https://get.k3s.io | sh -s -
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"

    - name: Wait for k3s server to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 300

    - name: Retrieve k3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_data

    - name: Set k3s token fact
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_data['content'] | b64decode | trim }}"

    - name: Add token to hostvars for agents
      ansible.builtin.add_host:
        name: "{{ item }}"
        k3s_token: "{{ k3s_token }}"
      loop: "{{ groups['k3s_agents'] }}"

- name: Deploy k3s agents
  hosts: k3s_agents
  become: yes
  tasks:
    - name: Copy k3s agent config
      ansible.builtin.template:
        src: files/k3s-config/config-agent.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"

    - name: Install k3s agent
      ansible.builtin.shell:
        cmd: curl -sfL https://get.k3s.io | sh -s - agent
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"

    - name: Wait for k3s agent to join cluster
      ansible.builtin.shell:
        cmd: systemctl is-active k3s-agent
      register: k3s_agent_status
      until: k3s_agent_status.stdout == "active"
      retries: 10
      delay: 6
      changed_when: false

- name: Fetch kubeconfig to localhost
  hosts: k3s_server
  become: yes
  tasks:
    - name: Fetch kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config-k3s
        flat: yes

    - name: Fix server address in kubeconfig
      ansible.builtin.replace:
        path: ~/.kube/config-k3s
        regexp: 'https://127\.0\.0\.1:6443'
        replace: 'https://{{ k3s_server_ip }}:6443'
      delegate_to: localhost
      become: no
